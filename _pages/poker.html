author_profile: true

<style>
  .poker-game {
    max-width: 700px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .cards-section {
    margin-bottom: 1.5em;
  }
  .cards-section h3 {
    margin-bottom: 0.3em;
    font-size: 1em;
    color: #555;
  }
  .card-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 84px;
    border: 2px solid #333;
    border-radius: 8px;
    background: #fff;
    font-size: 1.4em;
    font-weight: bold;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.15);
  }
  .card.red { color: #d00; }
  .card.black { color: #222; }
  .slider-section {
    margin: 1.5em 0;
  }
  .slider-section label {
    font-weight: bold;
    display: block;
    margin-bottom: 0.3em;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slider-row input[type="range"] {
    flex: 1;
    height: 6px;
    cursor: pointer;
  }
  .slider-value {
    font-size: 1.3em;
    font-weight: bold;
    min-width: 55px;
    text-align: right;
  }
  .btn {
    display: inline-block;
    padding: 10px 28px;
    font-size: 1em;
    font-weight: bold;
    color: #fff;
    background: #2a7ae2;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 0.5em;
  }
  .btn:hover { background: #1b5eb5; }
  .btn:disabled { background: #aaa; cursor: default; }
  .result-msg {
    margin-top: 1em;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 1.05em;
    line-height: 1.5;
  }
  .result-msg.round { background: #f0f4fa; border: 1px solid #ccd; }
  .result-msg.final { background: #e8f5e9; border: 1px solid #a5d6a7; }
  .score-bar {
    margin-top: 1em;
    font-size: 0.95em;
    color: #555;
  }
  .hand-name {
    font-weight: bold;
    color: #2a7ae2;
  }
</style>

<div class="poker-game">
  <p>
    Given a board and your hole cards, guess what percentage of all possible opponent hands your hand beats.
    Play 10 rounds &mdash; your score is the average error across all rounds. Lower is better!
  </p>

  <div id="game-area">
    <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
  </div>
</div>

<script src="/assets/js/poker.js"></script>
