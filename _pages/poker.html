<div class="poker-game">
  <p>
    Given a board and your hole cards, guess what percentage of all possible opponent hands your hand beats.
    Play 10 rounds &mdash; your score is the average error across all rounds. Lower is better!
  </p>

  <div id="game-area">
    <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
  </div>
</div>

<script>
(function() {
  // --- Card representation ---
  const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
  const SUITS = ['s','h','d','c']; // spades, hearts, diamonds, clubs
  const SUIT_SYMBOLS = { s: '\u2660', h: '\u2665', d: '\u2666', c: '\u2663' };
  const SUIT_COLORS = { s: 'black', h: 'red', d: 'red', c: 'black' };

  function cardIndex(rank, suit) { return rank * 4 + suit; }
  function cardRank(c) { return c >> 2; }
  function cardSuit(c) { return c & 3; }
  function cardName(c) { return RANKS[cardRank(c)] + SUIT_SYMBOLS[SUITS[cardSuit(c)]]; }
  function cardColor(c) { return SUIT_COLORS[SUITS[cardSuit(c)]]; }

  // --- Deck ---
  function fullDeck() {
    const d = [];
    for (let i = 0; i < 52; i++) d.push(i);
    return d;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // --- Hand evaluation ---
  // Returns an array [category, ...kickers] for lexicographic comparison.
  // Category: 0=high card, 1=pair, 2=two pair, 3=trips, 4=straight, 5=flush,
  //           6=full house, 7=quads, 8=straight flush
  function evaluate5(cards) {
    const ranks = cards.map(cardRank).sort((a, b) => b - a);
    const suits = cards.map(cardSuit);

    // Check flush
    const isFlush = suits.every(s => s === suits[0]);

    // Check straight
    let isStraight = false;
    let straightHigh = -1;
    // Normal straight
    if (ranks[0] - ranks[4] === 4 && new Set(ranks).size === 5) {
      isStraight = true;
      straightHigh = ranks[0];
    }
    // Wheel (A-2-3-4-5)
    if (!isStraight && ranks[0] === 12 && ranks[1] === 3 && ranks[2] === 2 && ranks[3] === 1 && ranks[4] === 0) {
      isStraight = true;
      straightHigh = 3; // 5-high
    }

    if (isStraight && isFlush) return [8, straightHigh];
    if (isStraight && !isFlush) {
      // Will handle after group checks, but straights beat trips
    }

    // Group by rank
    const counts = {};
    for (const r of ranks) counts[r] = (counts[r] || 0) + 1;
    const groups = Object.entries(counts)
      .map(([r, c]) => [c, parseInt(r)])
      .sort((a, b) => b[0] - a[0] || b[1] - a[1]);

    if (groups[0][0] === 4) {
      // Four of a kind
      return [7, groups[0][1], groups[1][1]];
    }
    if (groups[0][0] === 3 && groups[1][0] === 2) {
      // Full house
      return [6, groups[0][1], groups[1][1]];
    }
    if (isFlush) {
      return [5, ...ranks];
    }
    if (isStraight) {
      return [4, straightHigh];
    }
    if (groups[0][0] === 3) {
      // Three of a kind
      const kickers = groups.slice(1).map(g => g[1]).sort((a, b) => b - a);
      return [3, groups[0][1], ...kickers];
    }
    if (groups[0][0] === 2 && groups[1][0] === 2) {
      // Two pair
      const pairs = [groups[0][1], groups[1][1]].sort((a, b) => b - a);
      return [2, pairs[0], pairs[1], groups[2][1]];
    }
    if (groups[0][0] === 2) {
      // One pair
      const kickers = groups.slice(1).map(g => g[1]).sort((a, b) => b - a);
      return [1, groups[0][1], ...kickers];
    }
    // High card
    return [0, ...ranks];
  }

  // C(7,5) = 21 combinations
  function bestOf7(cards) {
    let best = null;
    for (let i = 0; i < 7; i++) {
      for (let j = i + 1; j < 7; j++) {
        // Exclude cards i and j
        const hand5 = cards.filter((_, idx) => idx !== i && idx !== j);
        const val = evaluate5(hand5);
        if (!best || compareHands(val, best) > 0) best = val;
      }
    }
    return best;
  }

  function compareHands(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const ai = i < a.length ? a[i] : 0;
      const bi = i < b.length ? b[i] : 0;
      if (ai !== bi) return ai - bi;
    }
    return 0;
  }

  const HAND_NAMES = [
    'High Card', 'One Pair', 'Two Pair', 'Three of a Kind',
    'Straight', 'Flush', 'Full House', 'Four of a Kind', 'Straight Flush'
  ];

  function handName(eval7) {
    return HAND_NAMES[eval7[0]];
  }

  // --- Compute equity ---
  // Given 5 board cards and 2 hero cards, compute % of opponent 2-card hands hero beats.
  function computeEquity(board, hero) {
    const used = new Set([...board, ...hero]);
    const remaining = [];
    for (let i = 0; i < 52; i++) {
      if (!used.has(i)) remaining.push(i);
    }

    const heroCards = [...board, ...hero];
    const heroVal = bestOf7(heroCards);

    let wins = 0, ties = 0, total = 0;
    for (let i = 0; i < remaining.length; i++) {
      for (let j = i + 1; j < remaining.length; j++) {
        const oppCards = [...board, remaining[i], remaining[j]];
        const oppVal = bestOf7(oppCards);
        const cmp = compareHands(heroVal, oppVal);
        if (cmp > 0) wins++;
        else if (cmp === 0) ties++;
        total++;
      }
    }
    // Count ties as half a win
    return ((wins + ties * 0.5) / total) * 100;
  }

  // --- Game state ---
  let round = 0;
  let errors = [];
  let currentEquity = 0;
  let currentHeroVal = null;

  function startGame() {
    round = 0;
    errors = [];
    nextRound();
  }

  function nextRound() {
    round++;
    const deck = shuffle(fullDeck());
    const board = deck.slice(0, 5);
    const hero = deck.slice(5, 7);

    // Compute equity (this is fast enough: 990 opponent combos * 21 evals each)
    currentEquity = computeEquity(board, hero);
    currentHeroVal = bestOf7([...board, ...hero]);

    const area = document.getElementById('game-area');
    area.innerHTML = '';

    // Round indicator
    const roundInfo = document.createElement('div');
    roundInfo.className = 'score-bar';
    roundInfo.textContent = 'Round ' + round + ' of 10' +
      (errors.length > 0 ? '  |  Running avg error: ' + (errors.reduce((a, b) => a + b, 0) / errors.length).toFixed(1) + '%' : '');
    area.appendChild(roundInfo);

    // Board
    const boardSection = document.createElement('div');
    boardSection.className = 'cards-section';
    boardSection.innerHTML = '<h3>Board</h3><div class="card-row">' +
      board.map(c => '<div class="card ' + cardColor(c) + '">' + cardName(c) + '</div>').join('') +
      '</div>';
    area.appendChild(boardSection);

    // Hero hand
    const heroSection = document.createElement('div');
    heroSection.className = 'cards-section';
    heroSection.innerHTML = '<h3>Your Hand</h3><div class="card-row">' +
      hero.map(c => '<div class="card ' + cardColor(c) + '">' + cardName(c) + '</div>').join('') +
      '</div>';
    area.appendChild(heroSection);

    // Slider
    const sliderSection = document.createElement('div');
    sliderSection.className = 'slider-section';
    sliderSection.innerHTML =
      '<label>Your guess: what % of opponent hands does your hand beat?</label>' +
      '<div class="slider-row">' +
        '<span>0%</span>' +
        '<input type="range" id="guess-slider" min="0" max="100" value="50">' +
        '<span>100%</span>' +
        '<span class="slider-value" id="slider-val">50%</span>' +
      '</div>';
    area.appendChild(sliderSection);

    const slider = sliderSection.querySelector('#guess-slider');
    const sliderVal = sliderSection.querySelector('#slider-val');
    slider.addEventListener('input', function() {
      sliderVal.textContent = this.value + '%';
    });

    // Submit button
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'Submit Guess';
    btn.onclick = function() { submitGuess(parseInt(slider.value)); };
    area.appendChild(btn);
  }

  function submitGuess(guess) {
    const error = Math.abs(guess - currentEquity);
    errors.push(error);

    const area = document.getElementById('game-area');

    // Disable submit button
    const btn = area.querySelector('.btn');
    btn.disabled = true;

    // Show result
    const result = document.createElement('div');
    result.className = 'result-msg round';
    result.innerHTML =
      'Your hand: <span class="hand-name">' + handName(currentHeroVal) + '</span><br>' +
      'Actual equity: <strong>' + currentEquity.toFixed(1) + '%</strong><br>' +
      'Your guess: <strong>' + guess + '%</strong><br>' +
      'Error: <strong>' + error.toFixed(1) + '%</strong>';
    area.appendChild(result);

    if (round < 10) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn';
      nextBtn.textContent = 'Next Round';
      nextBtn.onclick = nextRound;
      area.appendChild(nextBtn);
    } else {
      showFinalScore();
    }
  }

  function showFinalScore() {
    const avgError = errors.reduce((a, b) => a + b, 0) / errors.length;
    const area = document.getElementById('game-area');

    const final = document.createElement('div');
    final.className = 'result-msg final';
    let rating;
    if (avgError < 5) rating = 'Incredible!';
    else if (avgError < 10) rating = 'Excellent!';
    else if (avgError < 15) rating = 'Great!';
    else if (avgError < 20) rating = 'Good';
    else if (avgError < 30) rating = 'Decent';
    else rating = 'Keep practicing!';

    final.innerHTML =
      '<strong>Game Over!</strong><br>' +
      'Average error: <strong>' + avgError.toFixed(1) + '%</strong><br>' +
      rating + '<br><br>' +
      'Errors by round: ' + errors.map((e, i) => 'R' + (i+1) + ': ' + e.toFixed(1) + '%').join(', ');
    area.appendChild(final);

    const restartBtn = document.createElement('button');
    restartBtn.className = 'btn';
    restartBtn.textContent = 'Play Again';
    restartBtn.onclick = startGame;
    area.appendChild(restartBtn);
  }

  // Expose to global scope for onclick
  window.startGame = startGame;
})();
</script>
