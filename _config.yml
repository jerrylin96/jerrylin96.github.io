# Site configuration. Jekyll reads this file once, so restart `jekyll serve`
# after editing it. Local previews also load _config.local.yml (see README.md).

title       : "Jerry Lin"
description : "Research on machine learning for climate modeling by Jerry Lin, a postdoctoral researcher at Boston University."
locale      : "en-US"
url         : https://jlin404.com # production URL, no trailing slash; see Domain in README.md
baseurl     : ""
repository  : "jerrylin96/jerrylin96.github.io"
timezone    : America/Los_Angeles # how dates in front matter are read
future      : false

author:
  name          : "Jerry Lin"
  bio           : "Postdoctoral Researcher at Boston University working under Libby Barnes"
  location      : "Boston, MA"
  avatar        : "/images/avatar-320.jpg" # made from images/bio-photo.jpg
  googlescholar : "https://scholar.google.com/citations?authuser=1&user=r8zHDdMAAAAJ"
  orcid         : "https://orcid.org/0000-0003-1778-9426"
  github        : "jerrylin96"
  bluesky       : "jlin404.com"
  researchgate  : "https://www.researchgate.net/profile/Jerry-Lin-33"

# Standard.site: this website is a site.standard.publication on the AT Protocol,
# and each page in `collections` is a site.standard.document. See README.md.
standard_site:
  did                    : "did:plc:qszahaiylwp5kys2irw4fllu" # @jlin404.com
  publication            : "3mzwnpagwzs57" # record key of the publication
  icon                   : "/images/icon-512.jpg" # square, at least 256x256, under 1 MB
  show_in_discover       : true # let Standard.site readers list this publication
  collections            : [publications, posts]
  # site.standard.theme.basic, as [r, g, b]. These also set the site's own colors
  # (assets/css/main.css), so readers show the publication the way the site looks.
  theme:
    background           : [255, 255, 255]
    foreground           : [28, 32, 36]
    accent               : [18, 94, 150]
    accent_foreground    : [255, 255, 255]

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  # Only _pages: other files with front matter (CSS, JSON) must not get a layout.
  - scope: { path: "_pages", type: pages }
    values: { layout: page }
  - scope: { path: "", type: publications }
    values: { layout: paper }
  - scope: { path: "", type: posts }
    values: { layout: post }

# Posts (_posts/YYYY-MM-DD-title.md) live under /writing/.
permalink: /writing/:title/

include:
  - .well-known
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - main.typ
  - node_modules
  - resume
  - scripts
  - vendor

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
