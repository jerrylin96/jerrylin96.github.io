{%- assign ss = site.standard_site -%}
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    {% include profile-links.html %}
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
    {%- if ss.did and ss.publication %}
    <p>
      Also published on the <a href="https://atproto.com">AT Protocol</a> with
      <a href="https://standard.site">Standard.site</a>
      (<a href="https://pdsls.dev/at://{{ ss.did }}/site.standard.publication/{{ ss.publication }}">publication record</a>).
    </p>
    {%- endif %}
  </div>
</footer>
